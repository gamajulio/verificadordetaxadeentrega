<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Taxa de Entrega</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        #resultado { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 4px; display: none; }
        #map { height: 350px; margin-top: 15px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Calculadora de Frete por Rota</h2>
    <div class="form-group">
        <label for="endereco">Endereço do Cliente (aperte Enter para calcular):</label>
        <input type="text" id="endereco" placeholder="Ex: Rua Exemplo, 123, Bairro, João Pessoa" onkeydown="verificarEnter(event)">
    </div>
    <button onclick="calcularFrete()">Calcular Rota e Taxa</button>

    <div id="resultado"></div>
    <div id="map"></div>
</div>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
<script>
    // Endereço de partida da sua loja
    const ENDERECO_ORIGEM = "Av. Camilo de Holanda, 19, João Pessoa - PB";

    // Sua nova tabela de taxas por km atualizada
    const TABELA_FRETE = [
        { limite: 1, valor: 7 },
        { limite: 2, valor: 8 },
        { limite: 3, valor: 10 },
        { limite: 4, valor: 11 },
        { limite: 5, valor: 13 },
        { limite: 6, valor: 14 },
        { limite: 7, valor: 15 },
        { limite: 8, valor: 17 },
        { limite: 9, valor: 18 },
        { limite: 10, valor: 20 },
        { limite: 11, valor: 21 },
        { limite: 12, valor: 23 },
        { limite: 13, valor: 24 },
        { limite: 14, valor: 26 },
        { limite: 15, valor: 27 },
        { limite: 16, valor: 28 },
        { limite: 17, valor: 30 },
        { limite: 18, valor: 31 },
        { limite: 19, valor: 33 },
        { limite: 20, valor: 34 },
        { limite: 999, valor: 40.00 } // Acima de 20 km (taxa máxima de segurança)
    ];

    let map = null;
    let routingControl = null;

    // Dispara o cálculo ao apertar Enter
    function verificarEnter(event) {
        if (event.key === 'Enter' || event.keyCode === 13) {
            event.preventDefault();
            calcularFrete();
        }
    }

    async function geocodificar(endereco) {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=` + encodeURIComponent(endereco);
        try {
            const resposta = await fetch(url);
            const dados = await resposta.json();
            if (dados && dados.length > 0) {
                return { lat: parseFloat(dados[0].lat), lon: parseFloat(dados[0].lon) };
            }
            return null;
        } catch (e) {
            console.error("Erro na geocodificação:", e);
            return null;
        }
    }

    function calcularDistanciaHaversine(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * (Math.PI / 180);
        const dLon = (lon2 - lon1) * (Math.PI / 180);
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    async function calcularFrete() {
        const enderecoCliente = document.getElementById('endereco').value;
        const divResultado = document.getElementById('resultado');
        const divMap = document.getElementById('map');

        if (!enderecoCliente) {
            alert('Por favor, digite o endereço do cliente.');
            return;
        }

        divResultado.style.display = 'block';
        divResultado.innerHTML = 'Calculando o trajeto pelas ruas... ⏳';

        const origem = await geocodificar(ENDERECO_ORIGEM);
        const destino = await geocodificar(enderecoCliente);

        if (!origem || !destino) {
            divResultado.innerHTML = '❌ Não foi possível encontrar o endereço. Tente especificar incluindo o bairro e a cidade.';
            return;
        }

        divMap.style.display = 'block';

        if (!map) {
            map = L.map('map').setView([origem.lat, origem.lon], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
        }

        if (routingControl) {
            map.removeControl(routingControl);
        }

        // Roteamento real pelas ruas
        routingControl = L.Routing.control({
            waypoints: [
                L.latLng(origem.lat, origem.lon),
                L.latLng(destino.lat, destino.lon)
            ],
            routeWhileDragging: false,
            showAlternatives: false,
            fitSelectedRoutes: true,
            language: 'pt',
            lineOptions: { styles: [{ color: '#007bff', opacity: 0.8, weight: 6 }] },
            createMarker: function(i, wp) {
                return L.marker(wp.latLng).bindPopup(i === 0 ? "Sua Loja" : "Cliente");
            }
        }).addTo(map);

        let rotaCalculadaComSucesso = false;

        routingControl.on('routesfound', function(e) {
            rotaCalculadaComSucesso = true;
            const distanciaKm = e.routes[0].summary.totalDistance / 1000;
            aplicarTaxa(distanciaKm, "🚗 Rota Real pelas Ruas");
        });

        routingControl.on('routingerror', function() {
            if (!rotaCalculadaComSucesso) {
                const distanciaKm = calcularDistanciaHaversine(origem.lat, origem.lon, destino.lat, destino.lon);
                aplicarTaxa(distanciaKm, "📏 Distância Estimada (Plano de Segurança)");
            }
        });
    }

    function aplicarTaxa(distanciaKm, tipoCalculo) {
        let valorTaxa = 40.00; // Valor padrão caso ultrapasse os limites
        for (let faixa of TABELA_FRETE) {
            if (distanciaKm <= faixa.limite) {
                valorTaxa = faixa.valor;
                break;
            }
        }

        const divResultado = document.getElementById('resultado');
        divResultado.innerHTML = `
            <strong>Tipo:</strong> ${tipoCalculo}<br>
            <strong>📍 Distância do Trajeto:</strong> ${distanciaKm.toFixed(2)} km<br>
            <strong>💰 Taxa de Entre
